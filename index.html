<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Pinch-zoom MUST stay enabled. The target user has eyesight problems;
      blocking user-scalable strands him at the designed font size with no
      recourse. iOS 10+ Safari ignores user-scalable=no for accessibility
      anyway, but in installed-PWA (Add to Home Screen) standalone mode it
      DOES honor it — so dropping the flag is necessary, not cosmetic.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      Theme + favicon updated to match the new HomeScreen design palette.
      Both icons are SVG data URIs (no PNG assets to ship). The standard
      favicon includes a faint inset stroke for tile-edge depth; the
      apple-touch-icon variant drops the stroke since it looks cleaner
      at home-screen sizes.
    -->
    <meta name="theme-color" content="#F1E5CF" />
    <meta name="apple-mobile-web-app-title" content="Scrabble" />
    <!--
      Tile typography — Domine 700 (letter) + Atkinson Hyperlegible 700
      (score digit). Pulled verbatim from the alphabet-tile final spec.
      Preconnect tags are required by the spec.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Domine:wght@700&family=Atkinson+Hyperlegible:wght@700&display=swap" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23F8EBD0'/%3E%3Cstop offset='1' stop-color='%23DCBE91'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='92' height='92' rx='18' fill='url(%23g)' stroke='%236F4423' stroke-opacity='.22' stroke-width='2'/%3E%3Ctext x='50' y='52' text-anchor='middle' dominant-baseline='central' font-family='Domine,Georgia,serif' font-weight='800' font-size='66' fill='%232A1A0C'%3ES%3C/text%3E%3Ctext x='80' y='86' text-anchor='middle' dominant-baseline='central' font-family='system-ui,sans-serif' font-weight='700' font-size='20' fill='%236F4423'%3E1%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23F8EBD0'/%3E%3Cstop offset='1' stop-color='%23DCBE91'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='92' height='92' rx='18' fill='url(%23g)' stroke='%236F4423' stroke-opacity='.22' stroke-width='2'/%3E%3Ctext x='50' y='52' text-anchor='middle' dominant-baseline='central' font-family='Domine,Georgia,serif' font-weight='800' font-size='66' fill='%232A1A0C'%3ES%3C/text%3E%3Ctext x='80' y='86' text-anchor='middle' dominant-baseline='central' font-family='system-ui,sans-serif' font-weight='700' font-size='20' fill='%236F4423'%3E1%3C/text%3E%3C/svg%3E" />
    <title>Scrabble Babble</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
