<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Pinch-zoom MUST stay enabled. The target user has eyesight problems;
      blocking user-scalable strands him at the designed font size with no
      recourse. iOS 10+ Safari ignores user-scalable=no for accessibility
      anyway, but in installed-PWA (Add to Home Screen) standalone mode it
      DOES honor it — so dropping the flag is necessary, not cosmetic.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      Theme + favicon updated to match the new HomeScreen design palette.
      Both icons are SVG data URIs (no PNG assets to ship). The standard
      favicon includes a faint inset stroke for tile-edge depth; the
      apple-touch-icon variant drops the stroke since it looks cleaner
      at home-screen sizes.
    -->
    <meta name="theme-color" content="#F1E5CF" />
    <meta name="apple-mobile-web-app-title" content="Scrabble" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='3' y='3' width='94' height='94' rx='18' fill='%236F4423'/%3E%3Crect x='5' y='5' width='90' height='90' rx='16' fill='none' stroke='%23000' stroke-opacity='.18' stroke-width='1.5'/%3E%3Ctext x='50' y='60' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='64' fill='%23F3E9D9'%3ES%3C/text%3E%3Ctext x='78' y='84' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='600' font-size='22' fill='%23F3E9D9' fill-opacity='.85'%3E1%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='3' y='3' width='94' height='94' rx='18' fill='%236F4423'/%3E%3Ctext x='50' y='60' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='64' fill='%23F3E9D9'%3ES%3C/text%3E%3Ctext x='78' y='84' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='600' font-size='22' fill='%23F3E9D9' fill-opacity='.85'%3E1%3C/text%3E%3C/svg%3E" />
    <title>Scrabble Babble</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
